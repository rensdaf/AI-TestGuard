name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_experiments:
        description: "Lancer les expériences complètes (nécessite data/creditcard.csv ou données synthétiques)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Style (Ruff)
        run: ruff check .
      - name: Tests rapides + couverture (échec => workflow rouge)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  full-experiments:
    if: github.event_name == 'workflow_dispatch' && inputs.full_experiments
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_experiments.py
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
